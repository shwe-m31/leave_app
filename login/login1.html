<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leave · Sign In</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg:        #dae0e6;
            --card:      #FFFFFF;
            --border:    #D8E6F0;
            --primary:   #005B96;
            --primary-h: #03396C;
            --text:      #011F4B;
            --muted:     #444444;
            --input-bg:  #F5FAFD;
            --radius-card: 16px;
            --radius-btn:  10px;
            --radius-inp:  10px;
            --shadow-card: 0 1px 3px rgba(0,0,0,.06), 0 4px 24px rgba(0,0,0,.08);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        /* ── Card ── */
        .login-container {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius-card);
            box-shadow: var(--shadow-card);
            width: 100%;
            max-width: 400px;
            padding: 40px;
            animation: fadeInUp 0.45s ease-out both;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ── Logo ── */
        .logo-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 28px;
        }
        .logo-icon {
            width: 36px;
            height: 36px;
            background: var(--primary);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .logo-icon svg { width: 20px; height: 20px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; }
        .logo-name { font-size: 15px; font-weight: 700; color: var(--text); letter-spacing: -0.3px; }

        /* ── Heading ── */
        .login-container h2 {
            font-size: 22px;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.4px;
            margin-bottom: 4px;
        }
        .login-container > p {
            font-size: 14px;
            color: var(--muted);
            margin-bottom: 28px;
        }

        /* ── Segmented control ── */
        .tab-buttons {
            display: flex;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 3px;
            margin-bottom: 24px;
            gap: 3px;
        }
        .tab-buttons button {
            flex: 1;
            height: 36px;
            border: none;
            background: transparent;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            color: var(--muted);
            cursor: pointer;
            transition: background 150ms, color 150ms, box-shadow 150ms;
            font-family: 'Inter', sans-serif;
        }
        .tab-buttons button.active {
            background: #8aa5bd;
            color: #FFFFFF;
            box-shadow: 0 1px 3px rgba(0,0,0,.12);
        }

        /* ── Inputs ── */
        .input-group {
            margin-bottom: 16px;
        }
        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text);
            margin-bottom: 6px;
        }
        .input-group input {
            width: 100%;
            height: 44px;
            padding: 0 14px;
            border: 1px solid var(--border);
            border-radius: var(--radius-inp);
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            background: var(--input-bg);
            color: var(--text);
            outline: none;
            transition: border-color 150ms, box-shadow 150ms;
        }
        .input-group input::placeholder { color: #9CA3AF; }
        .input-group input:focus {
            border-color: var(--primary);
            background: #fff;
            box-shadow: 0 0 0 3px rgba(37,99,235,.12);
        }

        /* ── Forgot ── */
        .forgot-password {
            text-align: right;
            margin-bottom: 20px;
            margin-top: -8px;
        }
        .forgot-password a {
            font-size: 13px;
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
        }
        .forgot-password a:hover { text-decoration: underline; }

        /* ── Primary button ── */
        .login-btn {
            width: 100%;
            height: 44px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: var(--radius-btn);
            font-size: 14px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: background 150ms;
        }
        .login-btn:hover { background: var(--primary-h); }

        /* ── Divider ── */
        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 20px 0;
            color: var(--muted);
            font-size: 12px;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        /* ── Footer / Terms ── */
        .terms {
            margin-top: 24px;
            font-size: 12px;
            color: var(--muted);
            text-align: center;
            line-height: 1.6;
        }
        .terms a { color: var(--primary); text-decoration: none; }
        .terms a:hover { text-decoration: underline; }

        /* ── Responsive ── */
        @media (max-width: 480px) {
            .login-container { padding: 28px 20px; }
        }
    </style>
</head>
<body>
    <div class="login-container">

        <!-- Logo -->

        <h2>Welcome back</h2>
        <p>Sign in to your account to continue</p>

        <!-- Segmented role selector -->
        <div class="tab-buttons">
            <button class="active" id="student-btn">Student</button>
            <button id="admin-btn">Administrator</button>
        </div>

        <!-- Form — preserving all original ids, action, method -->
        <form id="loginForm" action="#" method="post">
            <div class="input-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Enter your email">
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password">
            </div>

            

            <button class="login-btn" type="submit">Sign in</button>
        </form>

    
    </div>

    <!-- Original JavaScript preserved exactly -->
    <script src="../config.js"></script>
    <script>
        const studentBtn = document.getElementById("student-btn");
        const adminBtn = document.getElementById("admin-btn");
        let selectedRole = 'student'; // Default role

        // Role selection logic
        studentBtn.addEventListener("click", function() {
            selectedRole = 'student';
            studentBtn.classList.add("active");
            adminBtn.classList.remove("active");
        });

        adminBtn.addEventListener("click", function() {
            selectedRole = 'admin';
            adminBtn.classList.add("active");
            studentBtn.classList.remove("active");
        });

        // Login form submission
        document.getElementById("loginForm").addEventListener("submit", function(event) {
            event.preventDefault(); // Prevent form from reloading the page

            const emailInput = document.getElementById("email").value;
            const passwordInput = document.getElementById("password").value;

            console.log("Email entered:", emailInput, "Role:", selectedRole); // Debugging

            const formData = {
                email: emailInput,
                password: passwordInput,
                role: selectedRole
            };

            const apiUrl = API_CONFIG.getBaseUrl() + '/api/login';
            fetch(apiUrl, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(formData)
            })
            .then(response => response.json())
            .then(data => {
                console.log("Server response:", data); // Debugging

                if (data.message === "Login successful") {
                    localStorage.setItem("email", emailInput);
                    localStorage.setItem("userId", data.user.id);
                    localStorage.setItem("userName", data.user.name);
                    console.log("User data saved in localStorage"); // Debugging
                    
                    if (selectedRole === 'student') {
                        window.location.href = "../student/student.html";
                    } else {
                        window.location.href = "../admin/page1.html";
                    }
                } else {
                    alert("Invalid credentials");
                }
            })
            .catch(error => {
                console.error("Error:", error);
                alert("Login failed. Please try again.");
            });
        });
    </script>
</body>
</html>
